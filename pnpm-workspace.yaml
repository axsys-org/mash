packages:
  - "packages/*"
  - "apps/*"
  - "tests/*"

allowBuilds:
  # Carbon ships its generated SVG assets in the package. Its postinstall only
  # reports optional IBM telemetry and is not required to generate Mash icons.
  "@carbon/icons": false
  rs-module-lexer: true

# pnpm 10 does not run dependency lifecycle scripts unless they are listed here.
# These dependencies genuinely need theirs (native binary downloads or
# platform-specific parser bindings).
onlyBuiltDependencies:
  - "@parcel/watcher"
  - esbuild
  - playwright
  - rs-module-lexer
