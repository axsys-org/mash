packages:
  - "packages/*"
  - "apps/*"
  - "tests/*"

allowBuilds:
  esbuild: true
  rs-module-lexer: true

# pnpm 10 does not run dependency lifecycle scripts unless they are listed here.
# These dependencies genuinely need theirs (native binary downloads or
# platform-specific parser bindings).
onlyBuiltDependencies:
  - "@parcel/watcher"
  - esbuild
  - playwright
  - rs-module-lexer

patchedDependencies:
  echarts@6.0.0: patches/echarts@6.0.0.patch
