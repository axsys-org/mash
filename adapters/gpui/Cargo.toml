[package]
name = "mash-gpui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "First-class GPUI renderer adapter for Mash semantic contracts and catalogues."
repository = "https://github.com/axsys-org/mash"

[dependencies]
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed" }
gpui-base = { git = "https://github.com/longbridge/gpui-component", rev = "b77f352589503a114cdf709507c0738a88e28364" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", features = ["test-support"] }

[lints.rust]
unsafe_code = "forbid"
