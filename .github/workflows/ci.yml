name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Job layout
#
# Three checks run on every pull request, split along the lines a reviewer
# actually reasons about rather than one per build step:
#
#   build           does the source compile, and do the generated schemas and
#                   the static checks agree with it?
#   browser-tests   do the components behave in a real browser?
#   catalog         does the artifact designers review still build?
#
# The underlying build is about three seconds, so splitting it further would
# buy nothing but runner startup: tokens, components and the manifest are named
# steps inside `build`, and a failure in any of them is legible from the step
# name in the checks UI.
#
# `catalog` is separate on purpose. It is the same build Vercel runs for the PR
# preview, and it is deliberately independent of the tests — a failing browser
# test must not be able to imply the preview is broken. Vercel builds from its
# own Git integration regardless of what happens here; this job only tells us
# whether that build is likely to succeed.
# ---------------------------------------------------------------------------

env:
  # Playwright downloads browsers here; the path is the cache key target.
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright

jobs:
  build:
    name: Build and checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Tokens are validated on their own first, so an invalid token graph
      # fails with its own precise report rather than as a build error further
      # down. The build re-runs this, which is cheap and keeps the signal clear.
      - name: Validate token graph
        run: pnpm --filter @mash/tokens validate

      - name: Build tokens
        run: pnpm run tokens

      - name: Build components
        run: pnpm run components

      - name: Generate custom elements manifests
        run: pnpm run cem

      # The build must precede the checks, not follow them. Generated artifacts
      # are inputs to the checks: the catalog imports each package's
      # custom-elements.json, and check:exports reads dist/. Type-checking a
      # cold checkout fails on modules that do not exist yet.
      - name: Type check
        run: pnpm run check:types

      - name: Lint
        run: pnpm run check:lint

      - name: Check formatting
        run: pnpm run check:format

      # Catches broken `exports` maps, missing emitted files, extensionless
      # relative imports, and `sideEffects` drifting away from the modules that
      # actually register elements.
      - name: Check package exports
        run: pnpm run check:exports

      - name: Check component styling parts
        run: pnpm run check:parts

      - name: Check catalogue token consumers
        run: pnpm run check:tokens

      - name: Check Paper foundation contract
        run: pnpm run check:paper

      # A build that is not reproducible is a build nobody can review. The
      # token output is a pure function of the token sources, so building twice
      # must not change a single byte.
      #
      # This is a content comparison rather than `git diff --exit-code`:
      # packages/*/dist and custom-elements.json are gitignored here — they are
      # produced during build and publication, never committed — so a dirty-tree
      # check against them would always pass and prove nothing.
      - name: Check generated output is reproducible
        run: |
          hash_generated() {
            find packages -type f \( -path '*/dist/*' -o -name custom-elements.json \) \
              -not -path '*/node_modules/*' | sort | xargs sha256sum
          }
          before=$(hash_generated)
          pnpm run tokens && pnpm run components && pnpm run cem
          after=$(hash_generated)
          if [ "$before" != "$after" ]; then
            echo "::error::Rebuilding changed the generated output. It must be deterministic."
            diff <(echo "$before") <(echo "$after") || true
            exit 1
          fi
          echo "generated output is byte-identical across two builds"

  browser-tests:
    name: Browser tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build:catalog

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Chromium only on pull requests. Web Components do lean on parts of the
      # platform that still differ between engines, but paying for all three on
      # every push would make the loop too slow to be useful; `cross-browser`
      # covers them on main and tags.
      - name: Install Chromium
        run: pnpm --filter @mash/ui exec playwright install --with-deps chromium

      - name: Component tests
        run: pnpm run test:browser

      - name: Integration tests
        run: pnpm run test:integration

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/integration/playwright-report/
          retention-days: 7

  catalog:
    name: Catalog build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Exactly the command in vercel.json, from exactly the directory Vercel
      # runs it in, against as cold a tree as Vercel's builder gets. Blob
      # publication is gated on VERCEL=1, so this proves the deterministic
      # build without giving an ordinary CI job deployment credentials.
      #
      # All three of those details have broken a deployment. Vercel's project
      # Root Directory is apps/catalog, so its commands run there and not at
      # the repository root — which is why the command is `-w` prefixed, and
      # why this job reproduces the working directory rather than assuming it.
      # Building the packages in a separate step first would defeat the point
      # entirely: the failure being guarded against is the catalog being built
      # before its dependencies exist.
      - name: Build catalog and browser bundle (as Vercel does)
        working-directory: apps/catalog
        run: pnpm -w run build:vercel

      - name: Check the build emitted what it should
        run: |
          test -f apps/catalog/dist/index.html
          test -f apps/catalog/dist/stage.html
          test -f apps/catalog/dist/mash.js
          test -d apps/catalog/dist/assets
          echo "catalog build ok"

  # ---------------------------------------------------------------------------
  # Non-blocking while tests/visual/snapshots is empty: the first run on a
  # platform creates its baselines and Playwright reports that run as a
  # failure, having had nothing to compare against. See tests/visual/README.md
  # for how to promote this to a required check.
  # ---------------------------------------------------------------------------
  visual:
    name: Visual regression (scaffold)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build:catalog

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm --filter @mash/visual-tests exec playwright install --with-deps chromium

      - name: Screenshot canonical states
        run: pnpm run test:visual
        # Missing baselines are expected while this job is a scaffold. Keep the
        # job green, but continue to the artifact upload so the generated Linux
        # snapshots can be reviewed and committed later.
        continue-on-error: true

      # Download this from a main run to seed the committed Linux baselines.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-snapshots
          path: |
            tests/visual/snapshots/
            tests/visual/test-results/
          retention-days: 7
          if-no-files-found: ignore
