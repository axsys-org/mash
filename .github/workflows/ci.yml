name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Playwright downloads browsers here; the path is the cache key target.
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright

jobs:
  # ---------------------------------------------------------------------------
  # The main gate. Deliberately one job running plain package scripts in
  # dependency order, rather than a matrix of clever partial builds: each step
  # consumes the previous step's artifact, so splitting them across jobs would
  # only add cache plumbing to reproduce what a single machine already has.
  # ---------------------------------------------------------------------------
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Tokens are validated on their own first, so an invalid token graph
      # fails with its own precise report rather than as a build error further
      # down. The build re-runs this, which is cheap and keeps the signal clear.
      - name: Validate token graph
        run: pnpm --filter @mash/tokens validate

      # The full build must precede the checks, not follow them. Generated
      # artifacts are inputs to the checks: the catalog imports each package's
      # custom-elements.json, and check:exports reads dist/. Type-checking a
      # cold checkout before building fails on modules that do not exist yet.
      #
      # Build order within this step is the workspace dependency graph:
      # tokens -> @mash/ui -> @mash/shrine.
      - name: Build
        run: pnpm run build

      - name: Type check
        run: pnpm run check:types

      - name: Lint
        run: pnpm run check:lint

      - name: Check formatting
        run: pnpm run check:format

      - name: Check package exports
        run: pnpm run check:exports

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm --filter @mash/ui exec playwright install --with-deps chromium

      - name: Component tests (Chromium)
        run: pnpm run test

      - name: Integration tests (Chromium)
        run: pnpm run test:integration

      - name: Verify the catalog builds against the real packages
        run: pnpm --filter @mash/catalog build

      # A build that is not reproducible is a build nobody can review. The
      # token output is a pure function of the token sources, so rebuilding
      # must not change a single byte.
      - name: Check generated output is reproducible
        run: |
          pnpm --filter @mash/tokens build
          pnpm --filter @mash/ui build
          if ! git diff --quiet -- packages/tokens/dist; then
            echo "::error::Rebuilding tokens changed the generated output. It must be deterministic."
            git diff --stat -- packages/tokens/dist
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/integration/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The full browser matrix. Web Components lean hard on parts of the platform
  # that still differ between engines — :state(), delegatesFocus,
  # ElementInternals form association, forced-colors — so main and releases get
  # all three engines. Pull requests stay on Chromium to keep the loop fast.
  # ---------------------------------------------------------------------------
  cross-browser:
    name: Cross-browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Install ${{ matrix.browser }}
        run: pnpm --filter @mash/ui exec playwright install --with-deps ${{ matrix.browser }}

      - name: Component tests
        run: pnpm run test
        env:
          BROWSERS: ${{ matrix.browser }}

      - name: Integration tests
        run: pnpm --filter @mash/integration-tests exec playwright test --project=${{ matrix.browser }}
        env:
          ALL_BROWSERS: "1"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: tests/integration/playwright-report/
          retention-days: 7
